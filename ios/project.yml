name: SiteLens
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  leap-sdk:
    url: https://github.com/Liquid4All/leap-sdk.git
    exactVersion: 0.10.7
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: ai.sitelens.hackathon
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  SiteLens:
    type: application
    platform: iOS
    sources: [SiteLens]
    dependencies:
      - package: leap-sdk
        product: LeapModelDownloader
    info:
      path: SiteLens/Info.plist
      properties:
        CFBundleDisplayName: SiteLens
        UILaunchScreen: {}
        NSCameraUsageDescription: SiteLens checks construction-zone PPE without identifying people.
        NSLocalNetworkUsageDescription: Send safety detections to your local SiteLens dashboard.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
